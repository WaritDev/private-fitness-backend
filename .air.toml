# .air.toml
root = "."
tmp_dir = "tmp"

[build]
cmd       = "go build -o ./tmp/bin/server ./cmd/app"
bin       = "./tmp/bin/server"
full_bin  = "./tmp/bin/server"

include_ext = ["go", "sql", "tpl", "tmpl", "html", "yaml", "yml", "toml", "json", "env"]
exclude_dir = ["vendor", "tmp", "bin", "scripts", ".git", ".idea", ".vscode", "node_modules"]

delay = 500
stop_on_error = true

[log]
time  = true
color = true

[screen]
clear_on_rebuild = true

[watcher]
poll           = true
poll_interval  = 1000
follow_symlinks = true

[misc]
clean_on_exit = true