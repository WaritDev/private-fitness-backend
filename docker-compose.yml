services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-private-fitness
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-private_fitness}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-apppass}
      TZ: Asia/Bangkok
    command: ["mariadbd","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--skip-character-set-client-handshake"]
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u $$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-private-fitness
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - .:/app
    command: ["air", "-c", ".air.toml"]

volumes:
  mariadb_data: