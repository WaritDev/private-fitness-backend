services:
  postgres:
    image: postgres:16
    container_name: postgres-private-fitness
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-private-fitness
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: ["./server"]

volumes:
  postgres_data:
